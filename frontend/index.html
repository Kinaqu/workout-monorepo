<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kinova | Adaptive training workspace</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <link rel="mask-icon" href="/favicon.svg" color="#125bff">
  <meta name="theme-color" content="#05070b">
</head>
<body>
  <div class="container">
    <!-- React root: rendered by features/onboarding (mounted from app.js) -->
    <section id="onboarding-shell" class="hidden" aria-labelledby="onboarding-title"></section>

    <!-- React root: rendered by features/recommendation (mounted from app.js) -->
    <section id="recommendation-shell" class="hidden" aria-labelledby="recommendation-title"></section>

    <div id="app-shell" class="hidden">
      <!-- React root: rendered by features/today (mounted from app.js) -->
      <div id="tab-today" class="tab-content active"></div>

      <!-- React root: rendered by features/history (mounted from app.js) -->
      <div id="tab-history" class="tab-content"></div>

      <!-- React root: rendered by features/program (mounted from app.js) -->
      <div id="tab-program" class="tab-content"></div>
    </div>
  </div>

  <nav id="app-nav" class="bottom-nav hidden">
    <div class="nav-item active" data-tab="today">
      <div class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"></path><path d="m2.5 21.5 1.4-1.4"></path><path d="m20.1 3.9 1.4-1.4"></path><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"></path><path d="m9.6 14.4 4.8-4.8"></path></svg></div>
      <span>Today</span>
    </div>
    <div class="nav-item" data-tab="history">
      <div class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg></div>
      <span>History</span>
    </div>
    <div class="nav-item" data-tab="program">
      <div class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h4"></path><path d="M2 10h4"></path><path d="M2 14h4"></path><path d="M2 18h4"></path><rect width="16" height="20" x="4" y="2" rx="2"></rect><path d="M9.5 8h5"></path><path d="M9.5 12H16"></path><path d="M9.5 16H14"></path></svg></div>
      <span>Plan</span>
    </div>
  </nav>



  <script type="module" src="/app.js"></script>
  <script src="/sw-register.js"></script>
</body>
</html>
