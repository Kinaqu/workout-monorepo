<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bone Fixtures | Kinova</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="boneyard-fixture-page">
  <main class="boneyard-fixture-stage">
    <section class="boneyard-fixture-section" data-boneyard="today-shell">
      <div class="boneyard-capture-shell">
        <div class="boneyard-fixture-card boneyard-fixture-card-hero"></div>
        <div class="boneyard-fixture-card boneyard-fixture-card-guidance"></div>
        <div class="boneyard-fixture-stack">
          <div class="boneyard-fixture-card boneyard-fixture-card-workout"></div>
          <div class="boneyard-fixture-card boneyard-fixture-card-workout"></div>
          <div class="boneyard-fixture-card boneyard-fixture-card-workout"></div>
        </div>
        <div class="boneyard-fixture-card boneyard-fixture-card-tools"></div>
      </div>
    </section>

    <section class="boneyard-fixture-section" data-boneyard="history-shell">
      <div class="boneyard-capture-shell boneyard-history-shell">
        <div class="boneyard-fixture-card boneyard-fixture-card-history-list"></div>
        <div class="boneyard-history-detail-stack">
          <div class="boneyard-fixture-card boneyard-fixture-card-history-detail"></div>
          <div class="boneyard-fixture-card boneyard-fixture-card-history-detail"></div>
          <div class="boneyard-fixture-card boneyard-fixture-card-history-note"></div>
        </div>
      </div>
    </section>

    <section class="boneyard-fixture-section" data-boneyard="program-shell">
      <div class="boneyard-capture-shell">
        <div class="boneyard-fixture-card boneyard-fixture-card-program-summary"></div>
        <div class="boneyard-fixture-card boneyard-fixture-card-program-week"></div>
        <div class="boneyard-fixture-stack">
          <div class="boneyard-fixture-card boneyard-fixture-card-program-workout"></div>
          <div class="boneyard-fixture-card boneyard-fixture-card-program-workout"></div>
        </div>
        <div class="boneyard-fixture-card boneyard-fixture-card-program-meta"></div>
      </div>
    </section>

    <section class="boneyard-fixture-section" data-boneyard="recommendation-shell">
      <div class="boneyard-capture-shell">
        <div class="boneyard-fixture-card boneyard-fixture-card-recommendation-profile"></div>
        <div class="boneyard-fixture-card boneyard-fixture-card-recommendation-stepper"></div>
        <div class="boneyard-fixture-stack">
          <div class="boneyard-fixture-card boneyard-fixture-card-recommendation-option"></div>
          <div class="boneyard-fixture-card boneyard-fixture-card-recommendation-option"></div>
          <div class="boneyard-fixture-card boneyard-fixture-card-recommendation-option"></div>
        </div>
        <div class="boneyard-fixture-card boneyard-fixture-card-recommendation-actions"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/bones-fixtures.js"></script>
</body>
</html>
