name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: frontend-ci-job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: bash scripts/ci-install-playwright.sh

      - name: Run local smoke tests
        env:
          EXPECT_CLERK_PUBLISHABLE_KEY: "false"
        run: npm run test:smoke:local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
