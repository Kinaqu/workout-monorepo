name: Frontend Deployment Smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: read

concurrency:
  group: frontend-deployment-smoke-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  frontend-deployment-smoke:
    name: frontend-deployment-smoke-job
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECT_CLERK_PUBLISHABLE_KEY: "true"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: bash scripts/ci-install-playwright.sh

      - name: Require deployment bypass secret
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "Missing GitHub secret: VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi

      - name: Resolve Vercel deployment URL
        env:
          DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOYMENT_KIND: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          DEPLOYMENT_HOST_FRAGMENT: workout-frontend-
        run: |
          set -euo pipefail

          base_url=""

          for attempt in $(seq 1 30); do
            deployments_json=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${DEPLOYMENT_SHA}")

            deployment_ids=$(printf '%s' "$deployments_json" | jq -r '
              map(select(.creator.login == "vercel[bot]"))
              | sort_by(.created_at)
              | reverse
              | .[].id
            ')

            for deployment_id in $deployment_ids; do
              statuses_json=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses")
              state=$(printf '%s' "$statuses_json" | jq -r '.[0].state // empty')
              base_url=$(printf '%s' "$statuses_json" | jq -r '.[0].environment_url // .[0].target_url // empty')

              if [ -z "$base_url" ] || [[ "$base_url" != *"$DEPLOYMENT_HOST_FRAGMENT"* ]]; then
                continue
              fi

              if [ "$state" = "success" ] && [ -n "$base_url" ]; then
                echo "Resolved deployment URL: $base_url"
                echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
                exit 0
              fi

              if [ "$state" = "error" ] || [ "$state" = "failure" ]; then
                echo "Vercel deployment entered state: $state"
                exit 1
              fi
            done

            echo "Waiting for ${DEPLOYMENT_KIND} Vercel deployment for ${DEPLOYMENT_SHA} (attempt ${attempt}/30)"
            sleep 10
          done

          echo "Timed out waiting for a Vercel deployment URL"
          exit 1

      - name: Show deployment URL
        run: echo "Testing $BASE_URL"

      - name: Run deployment smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deployment-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
